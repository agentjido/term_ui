name: CI

on:
  push:
    branches: [main, develop, "maint/1.x", "release/**"]
  pull_request:
    branches: [main, develop, "maint/1.x", "release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Elixir. Pre-OTP 28 uses the TTY fallback.
          - elixir: "1.15"
            otp: "26"
          - elixir: "1.19"
            otp: "28"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests with coverage
        run: mix coveralls

  platform:
    name: Platform test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-platform-otp-28-elixir-1.19-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-platform-otp-28-elixir-1.19-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"

      - name: Install Windows console check tools
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: pywinpty==3.0.5 pyte==0.8.2

      - name: Check real Windows console input, output, and cleanup
        if: runner.os == 'Windows'
        env:
          MIX_ENV: dev
        run: |
          mix compile --warnings-as-errors
          python test/support/windows_console_check.py

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache dependencies and PLTs
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-quality-otp-28-elixir-1.19-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-otp-28-elixir-1.19-

      - name: Install dependencies
        run: mix deps.get

      - name: Run quality checks
        run: mix quality

      - name: Check dependencies
        run: |
          mix deps.unlock --check-unused
          mix hex.audit
          mix deps.audit

      - name: Build Hex package
        run: mix hex.build

  examples:
    name: Compile examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Compile every example with warnings as errors
        shell: bash
        run: |
          example_deps="$RUNNER_TEMP/term-ui-example-deps"
          example_build="$RUNNER_TEMP/term-ui-example-build"

          for mix_file in examples/*/mix.exs; do
            example_dir="${mix_file%/mix.exs}"
            (
              cd "$example_dir"
              MIX_DEPS_PATH="$example_deps" MIX_BUILD_PATH="$example_build" mix deps.get
              MIX_DEPS_PATH="$example_deps" MIX_BUILD_PATH="$example_build" mix compile --warnings-as-errors
            )
          done
