name: Jido Review

on:
  pull_request:
    branches:
      - main
      - maint/1.x

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Jido Review
    uses: agentjido/github-actions/.github/workflows/jido-review.yml@fa16d77ff51210b52c1c283e96875eb9d5ca668c # v5
