name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing annotated v-prefixed SemVer tag to publish"
        required: true
        type: string
      dry_run:
        description: "Validate without Hex or GitHub publication"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Release
    uses: agentjido/github-actions/.github/workflows/jido-release.yml@fa16d77ff51210b52c1c283e96875eb9d5ca668c # v5
    with:
      operation: publish
      tag_name: ${{ inputs.tag_name }}
      release_branch: main
      staged_prepare: true
      otp_version: "29"
      elixir_version: "1.20"
      preflight_command: >-
        TERM_UI_TTY_NIF=source mix quality &&
        mix coveralls --warnings-as-errors &&
        mix spex &&
        mix docs --warnings-as-errors -f html &&
        mix deps.unlock --check-unused &&
        mix hex.audit &&
        mix hex.build --output /tmp/term-ui-release.tar
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
