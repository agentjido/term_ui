name: Bug report
description: Report a reproducible TermUI defect.
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include TermUI version or commit, Elixir/OTP, OS, terminal name and version, and backend.
      placeholder: "TermUI 2.0.0; Elixir 1.19; OTP 28; macOS; terminal version; raw backend"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a small application or the example command and exact input.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: State what should happen and what happened.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or terminal evidence
      description: Include received key bytes, resize results, or cleanup results when relevant. Remove private data.
      render: text
